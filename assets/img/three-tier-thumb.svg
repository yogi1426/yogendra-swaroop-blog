<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ee6a6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2ee6a6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="200" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#1c2733" stroke-width="1" opacity="0.6">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- three stacked tiers -->
  <rect x="150" y="70" width="300" height="46" rx="8" fill="#0f151d" stroke="#2ee6a6" stroke-width="2"/>
  <text x="300" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#e7edf3" font-weight="700">EDGE &amp; WEB</text>

  <line x1="300" y1="116" x2="300" y2="140" stroke="#2ee6a6" stroke-width="2"/>

  <rect x="150" y="140" width="300" height="46" rx="8" fill="#0f151d" stroke="#7cc7ff" stroke-width="2"/>
  <text x="300" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#e7edf3" font-weight="700">APPLICATION</text>

  <line x1="300" y1="186" x2="300" y2="210" stroke="#7cc7ff" stroke-width="2"/>

  <rect x="150" y="210" width="300" height="46" rx="8" fill="#0f151d" stroke="#c792ff" stroke-width="2"/>
  <text x="300" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#e7edf3" font-weight="700">DATA</text>

  <!-- side brackets -->
  <path d="M 130 70 L 118 70 L 118 256 L 130 256" stroke="#334454" stroke-width="2" fill="none"/>
  <path d="M 470 70 L 482 70 L 482 256 L 470 256" stroke="#334454" stroke-width="2" fill="none"/>
</svg>
