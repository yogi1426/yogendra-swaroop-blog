<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d131b"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="avatarMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ee6a6"/>
      <stop offset="100%" stop-color="#7cc7ff"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#2ee6a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2ee6a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#avatarBg)"/>
  <circle cx="100" cy="100" r="100" fill="url(#avatarGlow)"/>

  <!-- subtle grid -->
  <g stroke="#1c2733" stroke-width="1" opacity="0.5" clip-path="circle(100px at 100px 100px)">
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>

  <!-- monogram -->
  <text x="100" y="128" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="92" font-weight="700" fill="url(#avatarMark)">Y</text>

  <circle cx="100" cy="100" r="99" fill="none" stroke="#2ee6a6" stroke-width="2" opacity="0.6"/>
</svg>
